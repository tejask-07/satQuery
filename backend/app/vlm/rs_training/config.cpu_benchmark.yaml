model:
  model_name: Qwen/Qwen2.5-VL-3B-Instruct
  architecture_family: Qwen2.5-VL
  adapter_path: models/satquery-rs-vlm-cpu-benchmark

data:
  dataset: rsvqa
  dataset_root: null
  manifest_path: backend/data/rs_vlm/manifest.jsonl
  max_seq_length: 512
  validation_fraction: 0.1
  max_train_samples: 10
  max_validation_samples: 2
  max_test_samples: 2
  smoke_test: false
  seed: 42

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: models/satquery-rs-vlm-cpu-benchmark
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  warmup_ratio: 0.03
  optimizer: adamw_torch
  scheduler: cosine
  logging_steps: 1
  save_steps: 5
  eval_steps: 5
  save_total_limit: 2
  gradient_checkpointing: true
  precision: fp32
  quantization_4bit: false
  diagnostic_logging: true
  report_metrics: true
  seed: 42
